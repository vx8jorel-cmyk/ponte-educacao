services:
  - type: web
    name: jorelwast
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: Meta__AppId
        value: "1501344328133482"
      - key: Meta__AppSecret
        sync: false
      - key: Meta__RedirectUri
        value: https://jorelwast.onrender.com/api/auth/instagram/callback
      - key: Meta__PublicBaseUrl
        value: https://jorelwast.onrender.com
      - key: JORELWAST_DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
